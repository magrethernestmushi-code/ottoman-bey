<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>Mauzo — Ottoman Bey</title>
<style>
  :root{
    --gold:#D4AF37; --gold-d:#B8952E; --brown:#120B08; --brown2:#1F140D;
    --green:#2ECC71; --red:#E74C3C; --card:#241811;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--brown);color:#f3e9d8;min-height:100vh}
  .wrap{max-width:520px;margin:0 auto;padding:16px 14px 40px}
  h1{font-size:1.15rem;margin:6px 0 16px;color:var(--gold);text-align:center}
  .card{background:var(--card);border:1px solid rgba(212,175,55,.18);border-radius:14px;padding:14px;margin-bottom:14px}
  .input{width:100%;padding:12px;border-radius:10px;border:1px solid rgba(212,175,55,.3);background:#150E09;color:#fff;font-size:1rem;margin-bottom:10px}
  .btn{display:block;width:100%;padding:13px;border:none;border-radius:10px;font-weight:700;font-size:1rem;cursor:pointer}
  .btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold-d));color:#1a1206}
  .btn-green{background:var(--green);color:#06210f}
  .btn-green:disabled{opacity:.4}
  .btn-dark{background:#2a1d13;color:#f3e9d8;border:1px solid rgba(212,175,55,.25)}
  .err{color:var(--red);font-size:.85rem;margin:6px 0;min-height:18px}
  .lbl{font-size:.75rem;color:var(--gold-d);font-weight:700;margin-bottom:5px;display:block}
  .stats-row{display:flex;gap:10px;margin-bottom:14px}
  .stat{flex:1;background:var(--card);border:1px solid rgba(212,175,55,.18);border-radius:12px;padding:12px;text-align:center}
  .stat-v{font-size:1.15rem;font-weight:800;color:var(--gold)}
  .stat-l{font-size:.7rem;color:#c9b89a;margin-top:2px}
  .row3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}
  .line-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(212,175,55,.08)}
  .line-item:last-child{border-bottom:none}
  .li-name{flex:1;font-weight:600}
  .li-sub{font-size:.78rem;color:#c9b89a}
  .li-total{font-weight:700;color:var(--gold)}
  .li-x{background:none;border:none;color:var(--red);font-size:1.2rem;cursor:pointer;padding:0 4px}
  .waiter-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .wt-btn{padding:12px 8px;border-radius:10px;border:1px solid rgba(212,175,55,.3);background:#150E09;color:#f3e9d8;font-size:.88rem;font-weight:600;cursor:pointer;text-align:center}
  .wt-btn.active{background:var(--gold);color:#1a1206;border-color:var(--gold)}
  .pm-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .pm-btn{padding:10px 4px;border-radius:9px;border:1px solid rgba(212,175,55,.3);background:#150E09;color:#f3e9d8;font-size:.8rem;cursor:pointer}
  .pm-btn.active{background:var(--gold);color:#1a1206;border-color:var(--gold);font-weight:700}
  .muted{color:#9a8a70;font-size:.8rem}
  .log-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(212,175,55,.08);font-size:.85rem}
  .log-row:last-child{border-bottom:none}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .logout{color:#c9b89a;font-size:.8rem;background:none;border:none;cursor:pointer;text-decoration:underline}
  .empty{text-align:center;color:#9a8a70;padding:16px 0;font-size:.85rem}
  .spinner{width:22px;height:22px;border:3px solid rgba(212,175,55,.25);border-top-color:var(--gold);border-radius:50%;animation:sp .7s linear infinite;margin:16px auto}
  @keyframes sp{to{transform:rotate(360deg)}}
  .toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--green);color:#06210f;padding:12px 20px;border-radius:10px;font-weight:700;z-index:99;display:none;max-width:90%;text-align:center}
  .order-total-bar{display:flex;justify-content:space-between;align-items:center;padding:10px 0;font-weight:700;border-top:1px solid rgba(212,175,55,.15);margin-top:4px}
  .cd{font-size:.72rem;color:var(--gold-d);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
</style>
</head>
<body>

<!-- ═══ LOGIN ═══ -->
<div class="wrap" id="login-view">
  <h1>💰 Mauzo — Ottoman Bey</h1>
  <div class="card">
    <input class="input" id="l-user" placeholder="Jina la mtumiaji" autocomplete="username">
    <input class="input" id="l-pass" type="password" placeholder="Nenosiri" autocomplete="current-password">
    <div class="err" id="l-err"></div>
    <button class="btn btn-gold" onclick="login()" id="l-btn">🔐 Ingia</button>
  </div>
</div>

<!-- ═══ MAIN ═══ -->
<div class="wrap" id="main-view" style="display:none">
  <div class="topbar">
    <h1 style="margin:0">💰 Mauzo</h1>
    <button class="logout" onclick="logout()">Toka (<span id="who"></span>)</button>
  </div>

  <div class="stats-row">
    <div class="stat"><div class="stat-v" id="st-orders">0</div><div class="stat-l">Mauzo Leo</div></div>
    <div class="stat"><div class="stat-v" id="st-revenue">TZS 0</div><div class="stat-l">Mapato Leo</div></div>
  </div>

  <!-- Add item -->
  <div class="card">
    <div class="cd">1. Andika Chakula</div>
    <div class="row3">
      <div><span class="lbl">Chakula</span><input class="input" id="in-name" placeholder="mf. Chips mayai"></div>
      <div><span class="lbl">Idadi</span><input class="input" id="in-qty" type="number" min="1" value="1" inputmode="numeric"></div>
      <div><span class="lbl">Bei</span><input class="input" id="in-price" type="number" min="0" placeholder="3000" inputmode="numeric"></div>
    </div>
    <div class="err" id="in-err"></div>
    <button class="btn btn-dark" onclick="addLine()">➕ Ongeza kwenye Order</button>
  </div>

  <!-- Current order lines -->
  <div class="card" id="lines-card" style="display:none">
    <div class="cd">Order ya Sasa</div>
    <div id="lines-list"></div>
    <div class="order-total-bar"><span>JUMLA</span><span id="order-total" style="color:var(--gold)">TZS 0</span></div>
  </div>

  <!-- Waiter picker -->
  <div class="card" id="waiter-card" style="display:none">
    <div class="cd">2. Nani Ameuza (Waiter)</div>
    <div class="waiter-grid" id="waiter-grid"><div class="spinner"></div></div>
  </div>

  <!-- Payment + submit -->
  <div class="card" id="pay-card" style="display:none">
    <div class="cd">3. Njia ya Malipo</div>
    <div class="pm-grid" style="margin-bottom:12px">
      <button class="pm-btn active" onclick="selPM('cash',this)">💵 Cash</button>
      <button class="pm-btn" onclick="selPM('mpesa',this)">📱 M-Pesa</button>
      <button class="pm-btn" onclick="selPM('tigopesa',this)">📲 Tigo</button>
      <button class="pm-btn" onclick="selPM('airtelmoney',this)">📶 Airtel</button>
      <button class="pm-btn" onclick="selPM('card',this)">💳 Kadi</button>
      <button class="pm-btn" onclick="selPM('bank',this)">🏦 Benki</button>
    </div>
    <button class="btn btn-green" onclick="completeSale()" id="sale-btn">✅ Kamilisha Mauzo</button>
  </div>

  <div class="card">
    <div class="cd">🧾 Mauzo ya Leo</div>
    <div id="today-log"><div class="spinner"></div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API_BASE='';
let TOKEN=null, SESSION=null;
let LINES=[]; // {name, qty, price}
let WAITERS=[]; let SELECTED_WAITER=null;
let PAY_METHOD='cash';

function fmtTZS(n){return 'TZS '+Number(n||0).toLocaleString('en-US',{maximumFractionDigits:0});}
function fmtTime(d){return d?new Date(d).toLocaleTimeString('sw-TZ',{hour:'2-digit',minute:'2-digit'}):'—';}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',2400);}

async function api(path,opts){
  opts=opts||{};
  opts.headers=Object.assign({'Content-Type':'application/json'},opts.headers||{});
  if(TOKEN)opts.headers['Authorization']='Bearer '+TOKEN;
  const res=await fetch(API_BASE+path,opts);
  const data=await res.json().catch(()=>({}));
  if(!res.ok)throw new Error(data.error||'Hitilafu');
  return data;
}

async function login(){
  const username=document.getElementById('l-user').value.trim();
  const password=document.getElementById('l-pass').value;
  const err=document.getElementById('l-err'),btn=document.getElementById('l-btn');
  err.textContent='';
  if(!username||!password){err.textContent='Jaza jina na nenosiri';return;}
  btn.disabled=true;btn.textContent='Inaingia…';
  try{
    const d=await api('/api/login',{method:'POST',body:JSON.stringify({username,password})});
    if(d.user.role!=='Cashier'){err.textContent='Akaunti hii si ya Cashier. Ukurasa huu ni kwa ajili ya Cashier tu.';btn.disabled=false;btn.textContent='🔐 Ingia';await api('/api/logout',{method:'POST'}).catch(()=>{});return;}
    TOKEN=d.token;SESSION=d.user;
    sessionStorage.setItem('sale_token',TOKEN);
    initApp();
  }catch(e){err.textContent=e.message;btn.disabled=false;btn.textContent='🔐 Ingia';}
}
async function logout(){
  try{await api('/api/logout',{method:'POST'});}catch(_){}
  TOKEN=null;SESSION=null;sessionStorage.removeItem('sale_token');
  document.getElementById('main-view').style.display='none';
  document.getElementById('login-view').style.display='block';
  document.getElementById('l-pass').value='';
}

async function initApp(){
  document.getElementById('login-view').style.display='none';
  document.getElementById('main-view').style.display='block';
  document.getElementById('who').textContent=SESSION.name;
  await Promise.all([loadWaiters(),loadStats()]);
}

// ── Step 1: add free-text item lines ──────────────────────────
function addLine(){
  const nameEl=document.getElementById('in-name'), qtyEl=document.getElementById('in-qty'), priceEl=document.getElementById('in-price'), err=document.getElementById('in-err');
  err.textContent='';
  const name=nameEl.value.trim();
  const qty=Number(qtyEl.value);
  const price=Number(priceEl.value);
  if(!name){err.textContent='Andika jina la chakula';return;}
  if(!qty||qty<=0){err.textContent='Idadi si sahihi';return;}
  if(isNaN(price)||price<0){err.textContent='Bei si sahihi';return;}
  LINES.push({name,qty,price});
  nameEl.value='';qtyEl.value=1;priceEl.value='';
  nameEl.focus();
  renderLines();
}
function removeLine(i){LINES.splice(i,1);renderLines();}
function renderLines(){
  const card=document.getElementById('lines-card');
  const list=document.getElementById('lines-list');
  if(!LINES.length){card.style.display='none';updateGates();return;}
  card.style.display='block';
  let total=0;
  list.innerHTML=LINES.map((l,i)=>{
    const lt=l.qty*l.price;total+=lt;
    return `<div class="line-item">
      <div>
        <div class="li-name">${l.name}</div>
        <div class="li-sub">${l.qty} × ${fmtTZS(l.price)}</div>
      </div>
      <div class="li-total">${fmtTZS(lt)}</div>
      <button class="li-x" onclick="removeLine(${i})">✕</button>
    </div>`;
  }).join('');
  document.getElementById('order-total').textContent=fmtTZS(total);
  updateGates();
}
function updateGates(){
  document.getElementById('waiter-card').style.display=LINES.length?'block':'none';
  document.getElementById('pay-card').style.display=(LINES.length&&SELECTED_WAITER)?'block':'none';
}

// ── Step 2: waiter picker ──────────────────────────────────────
async function loadWaiters(){
  try{
    const d=await api('/api/waiter-availability');
    WAITERS=d.waiters||[];
    renderWaiters();
  }catch(e){document.getElementById('waiter-grid').innerHTML=`<p class="err">${e.message}</p>`;}
}
function renderWaiters(){
  const el=document.getElementById('waiter-grid');
  el.innerHTML=WAITERS.length?WAITERS.map(w=>`
    <button class="wt-btn ${SELECTED_WAITER===w.id?'active':''}" onclick="pickWaiter('${w.id}')">👤 ${w.full_name}</button>
  `).join(''):'<p class="empty">Hakuna mhudumu aliyesajiliwa</p>';
}
function pickWaiter(id){SELECTED_WAITER=id;renderWaiters();updateGates();}

// ── Step 3: payment + submit ────────────────────────────────────
function selPM(m,btn){PAY_METHOD=m;document.querySelectorAll('.pm-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');}

async function completeSale(){
  if(!LINES.length||!SELECTED_WAITER)return;
  const btn=document.getElementById('sale-btn');
  btn.disabled=true;btn.textContent='Inatuma…';
  try{
    const items=LINES.map(l=>({name:l.name,quantity:l.qty,price:l.price}));
    await api('/api/quick-sale',{method:'POST',body:JSON.stringify({items,waiter_id:SELECTED_WAITER,payment_method:PAY_METHOD})});
    LINES=[];SELECTED_WAITER=null;
    renderLines();renderWaiters();
    showToast('✅ Mauzo Yamekamilika!');
    await loadStats();
  }catch(e){showToast('⚠️ '+e.message);}
  finally{btn.disabled=false;btn.textContent='✅ Kamilisha Mauzo';}
}

// ── Stats + today's log ──────────────────────────────────────────
async function loadStats(){
  try{
    const today=new Date().toISOString().slice(0,10);
    const d=await api('/api/reports?from='+today+'&to='+today);
    document.getElementById('st-orders').textContent=d.summary.total_orders;
    document.getElementById('st-revenue').textContent=fmtTZS(d.summary.revenue);
    const el=document.getElementById('today-log');
    const orders=d.orders||[];
    el.innerHTML=orders.length?orders.map(o=>`
      <div class="log-row">
        <span>${fmtTime(o.paid_at)} · ${o.order_number}</span>
        <span>${(o.payment_method||'—').toUpperCase()} · <b style="color:var(--gold)">${fmtTZS(o.amount)}</b></span>
      </div>`).join(''):'<p class="empty">Bado hakuna mauzo leo</p>';
  }catch(e){document.getElementById('today-log').innerHTML=`<p class="err">${e.message}</p>`;}
}

// Auto-restore session for this browser tab only (sessionStorage, not
// localStorage) — closing the tab/browser logs the cashier out, which is
// safer on a shared till device.
(function boot(){
  const t=sessionStorage.getItem('sale_token');
  if(t){
    TOKEN=t;
    api('/api/me').then(d=>{SESSION=d.user;initApp();}).catch(()=>{sessionStorage.removeItem('sale_token');});
  }
})();
</script>
</body>
</html>
